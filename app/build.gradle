plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.home.ivajoin'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.home.ivajoin'
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName '2.4'
    }

    // Release signing: from environment variables (CI) or from keystore.properties next to
    // settings.gradle (local, not in git). Without either the release APK is left unsigned.
    //   storeFile=/path/to/release.jks
    //   keyAlias=alias
    //   passwordFile=/path/to/password.txt   (or password=...)
    def props = new Properties()
    def propsFile = rootProject.file('keystore.properties')
    if (propsFile.exists()) propsFile.withInputStream { props.load(it) }
    def expand = { String p -> p?.replaceFirst('^~', System.getProperty('user.home')) }
    def keystore = System.getenv('RELEASE_KEYSTORE') ?: expand(props.getProperty('storeFile'))
    def password = System.getenv('RELEASE_KEYSTORE_PASSWORD') ?: props.getProperty('password')
    if (!password && props.getProperty('passwordFile')) password = file(expand(props.getProperty('passwordFile'))).text.trim()
    def alias = System.getenv('RELEASE_KEY_ALIAS') ?: props.getProperty('keyAlias')
    def signed = keystore && file(keystore).exists() && password && alias
    signingConfigs {
        if (signed) {
            release {
                storeFile file(keystore)
                storePassword password
                keyAlias alias
                keyPassword password // PKCS12: same as the store password
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signed) signingConfig signingConfigs.release
        }
        // Installs next to the real app, so screenshots can be taken with made-up data
        // (adb shell am start -n ru.home.ivajoin.demo/ru.home.ivajoin.DemoSeedActivity).
        debug {
            applicationIdSuffix '.demo'
            versionNameSuffix '-demo'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
